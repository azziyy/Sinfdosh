<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>🎡 Yutuq G'ildiragi</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{
  --bg:#0b1024;--card:#171f4a;--card2:#1d2658;
  --gold:#ffd740;--green:#22c55e;--red:#ef4444;
  --accent:#8b5cf6;--accent2:#22d3ee;
  --text:#eef2ff;--muted:#8b95c8;--border:rgba(255,255,255,0.08);
}
body{
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(255,215,64,0.18), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(139,92,246,0.14), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,20px));background:rgba(11,16,36,0.85);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border)}
.back{background:rgba(255,255,255,0.06);border:1px solid var(--border);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.title{font-size:17px;font-weight:800}
.balance{background:linear-gradient(135deg,#ffd740,#ff9800);padding:8px 14px;border-radius:14px;font-weight:800;color:#1a0a00;font-size:13px}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}

.stage{
  background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:24px;padding:22px 16px;text-align:center;margin-bottom:18px;
}
.wheel-wrap{
  position:relative;width:300px;height:300px;margin:0 auto 16px;
}
.pointer{
  position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  width:0;height:0;
  border-left:18px solid transparent;border-right:18px solid transparent;
  border-top:30px solid #ffd740;
  filter:drop-shadow(0 4px 8px rgba(0,0,0,0.5));z-index:10;
}
.wheel{
  width:300px;height:300px;border-radius:50%;
  border:6px solid #ffd740;
  box-shadow:0 14px 40px rgba(0,0,0,0.6), inset 0 0 30px rgba(0,0,0,0.4);
  transition:transform 4.5s cubic-bezier(0.17, 0.67, 0.21, 0.99);
  position:relative;
  background:conic-gradient(
    #ef4444 0deg 45deg,
    #22c55e 45deg 90deg,
    #8b5cf6 90deg 135deg,
    #f59e0b 135deg 180deg,
    #22d3ee 180deg 225deg,
    #ec4899 225deg 270deg,
    #84cc16 270deg 315deg,
    #ffd740 315deg 360deg
  );
}
.wheel-center{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:60px;height:60px;border-radius:50%;
  background:linear-gradient(135deg,#1f2937,#0b1024);
  border:3px solid #ffd740;display:flex;align-items:center;justify-content:center;
  font-size:24px;z-index:5;
}
.wheel-label{
  position:absolute;color:#fff;font-weight:900;font-size:14px;text-shadow:0 2px 4px rgba(0,0,0,0.7);
  transform-origin:center;pointer-events:none;
}

.result-text{font-size:18px;font-weight:800;min-height:26px;margin-top:8px}
.result-text.win{color:var(--green)}
.result-text.lose{color:var(--red)}

.bet-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.bet-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.bet-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bet-input{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;font-size:18px;font-weight:700;outline:none}
.preset{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}

.spin-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ffd740,#ff9800);
  color:#1a0a00;font-weight:900;font-size:17px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 10px 28px rgba(255,152,0,0.45);text-transform:uppercase;
}
.spin-btn:active{transform:scale(0.98)}
.spin-btn:disabled{opacity:0.5;cursor:not-allowed}

.legend{
  display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px;
}
.lg-item{
  background:var(--card2);border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;
  border-left:4px solid #fff;
}
.lg-item .mul{color:var(--gold);display:block;font-size:13px;font-weight:900}

.info-strip{display:flex;gap:12px;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--muted)}
.info-strip strong{color:var(--text);display:block;font-size:14px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;opacity:0;transition:all 0.25s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.win{border-color:rgba(34,197,94,0.5)}
.toast.lose{border-color:rgba(239,68,68,0.5)}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="title">🎡 Yutuq G'ildiragi</div>
  <div class="balance"><span id="bal">—</span> so'm</div>
</div>

<div class="wrap">
  <div class="stage">
    <div class="wheel-wrap">
      <div class="pointer"></div>
      <div class="wheel" id="wheel">
        <div class="wheel-center">🎯</div>
      </div>
    </div>
    <div class="result-text" id="result">Stavka qiling va aylantiring!</div>
  </div>

  <div class="bet-card">
    <div class="bet-label">Stavka (so'm)</div>
    <div class="bet-row">
      <input class="bet-input" id="betInput" type="number" inputmode="numeric" pattern="[0-9]*" min="10" step="1" value="100" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="bet-row">
      <button class="preset" data-v="100">100</button>
      <button class="preset" data-v="500">500</button>
      <button class="preset" data-v="1000">1 000</button>
      <button class="preset" data-v="5000">5 000</button>
      <button class="preset" data-v="all">MAX</button>
    </div>

    <button class="spin-btn" id="spinBtn">🎡 Aylantirish</button>

    <div class="legend" id="legend"></div>

    <div class="info-strip">
      <div>O'yinlar<strong id="games">0</strong></div>
      <div>Yutuqlar<strong id="wins">0</strong></div>
      <div>Mag'lub<strong id="losses">0</strong></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getCurrentUser, initUser, watchUser, changeBalance, logGame, fmtMoney
} from '../js/firebase-shared.js?v=2.5.0';

const $ = s => document.querySelector(s);
function showToast(msg,type=''){
  const t=$('#toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

// 8 ta sektor: rang, multiplier
const SECTORS = [
  { color:'#ef4444', mult:0,    label:'Bust' },   // 0
  { color:'#22c55e', mult:1.5,  label:'×1.5' },   // 1
  { color:'#8b5cf6', mult:2,    label:'×2'   },   // 2
  { color:'#f59e0b', mult:0,    label:'Bust' },   // 3
  { color:'#22d3ee', mult:3,    label:'×3'   },   // 4
  { color:'#ec4899', mult:1.5,  label:'×1.5' },   // 5
  { color:'#84cc16', mult:5,    label:'×5'   },   // 6
  { color:'#ffd740', mult:10,   label:'×10'  }    // 7 — eng katta
];
const SECTOR_DEG = 360 / SECTORS.length; // 45

// Yorliqlarni g'ildirakka joylash
function placeLabels(){
  const wheel = $('#wheel');
  SECTORS.forEach((s, i) => {
    const lbl = document.createElement('div');
    lbl.className = 'wheel-label';
    lbl.textContent = s.label;
    // Markazi: sektor markazi (i*45 + 22.5)
    const angle = i * SECTOR_DEG + SECTOR_DEG/2 - 90; // -90 => top
    const radius = 110;
    const x = 150 + radius * Math.cos(angle * Math.PI / 180);
    const y = 150 + radius * Math.sin(angle * Math.PI / 180);
    lbl.style.left = x + 'px';
    lbl.style.top = y + 'px';
    lbl.style.transform = 'translate(-50%,-50%)';
    wheel.appendChild(lbl);
  });
}

function buildLegend(){
  const box = $('#legend');
  box.innerHTML = SECTORS.map(s => `
    <div class="lg-item" style="border-left-color:${s.color}">
      <span class="mul">${s.label}</span>
      <span>${s.mult === 0 ? 'Yutqaziladi' : 'Yutuq'}</span>
    </div>
  `).join('');
}

let balance = 0;
let busy = false;
let currentRotation = 0;
let stats = { games:0, wins:0, losses:0 };
const user = getCurrentUser();

function updBal(){ $('#bal').textContent = fmtMoney(balance); }
function updStats(){
  $('#games').textContent = stats.games;
  $('#wins').textContent = stats.wins;
  $('#losses').textContent = stats.losses;
}

document.querySelectorAll('.preset').forEach(b=>{
  b.addEventListener('click',()=>{
    const v = b.dataset.v;
    if (v === 'all') $('#betInput').value = Math.max(10, Math.floor(balance));
    else $('#betInput').value = v;
  });
});

async function spin(){
  if (busy) return;
  if (!user){ showToast('Tizimga kiring!','lose'); return; }
  const bet = Math.floor(parseFloat($('#betInput').value)||0);
  if (bet < 10){ showToast("Minimum 10 so'm",'lose'); return; }
  if (bet > balance){ showToast('Balans yetarli emas!','lose'); return; }

  busy = true; $('#spinBtn').disabled = true;
  $('#result').textContent = 'Aylanmoqda...';
  $('#result').className = 'result-text';

  try { await changeBalance(user.name, -bet, { isBet:true }); }
  catch(e){ busy=false; $('#spinBtn').disabled=false; showToast('Xato!','lose'); return; }

  // Tasodifiy sektor — vaznga ko'ra (kichik multiplerlar tez-tez)
  // Vaznlar: bust=high, 1.5=high, 2=mid, 3=mid, 5=low, 10=very low
  const weights = [22, 25, 18, 22, 8, 14, 5, 2]; // jami=116
  const totalW = weights.reduce((a,b)=>a+b,0);
  let r = Math.random() * totalW;
  let winIdx = 0;
  for (let i = 0; i < weights.length; i++){
    if (r < weights[i]) { winIdx = i; break; }
    r -= weights[i];
  }

  // G'ildirakni aylantirish
  // Top (12 soat) — angle 0 (pointer ko'rsatadi). Sektor i markazi: i*45 + 22.5
  // Aylantirgandan keyin sektor markazi top-ga tushishi kerak => rotation = -(winIdx*45 + 22.5) (mod 360) + bir necha to'liq aylanish
  const targetSectorCenter = winIdx * SECTOR_DEG + SECTOR_DEG/2;
  const targetRotation = 360 * 6 - targetSectorCenter + (Math.random()*SECTOR_DEG*0.7 - SECTOR_DEG*0.35);
  currentRotation += targetRotation;
  const wheel = $('#wheel');
  wheel.style.transform = `rotate(${currentRotation}deg)`;

  setTimeout(async ()=>{
    const sector = SECTORS[winIdx];
    stats.games++;
    if (sector.mult > 0){
      const winAmount = Math.floor(bet * sector.mult);
      await changeBalance(user.name, +winAmount, { isWin:true, gameEnd:true });
      await logGame(user.name, 'wheel', bet, winAmount, sector.mult);
      stats.wins++;
      $('#result').textContent = `🎉 ${sector.label}! +${fmtMoney(winAmount - bet)} so'm`;
      $('#result').className = 'result-text win';
      showToast(`+${fmtMoney(winAmount - bet)} so'm`,'win');
    } else {
      await changeBalance(user.name, 0, { gameEnd:true });
      await logGame(user.name, 'wheel', bet, 0, 0);
      stats.losses++;
      $('#result').textContent = `💥 Bust! −${fmtMoney(bet)} so'm`;
      $('#result').className = 'result-text lose';
      showToast(`−${fmtMoney(bet)} so'm`,'lose');
    }
    updStats();
    busy = false; $('#spinBtn').disabled = false;
  }, 4600);
}

$('#spinBtn').addEventListener('click', spin);

placeLabels();
buildLegend();

if (!user){
  showToast('Tizimga kiring!','lose');
  $('#bal').textContent = '0';
} else {
  (async ()=>{
    try {
      const res = await initUser(user.name);
      balance = Number(res.data.balance) || 0;
      updBal();
      watchUser(user.name, (data)=>{
        if (!data) return;
        balance = Number(data.balance) || 0; updBal();
      });
    } catch(e){ console.error(e); showToast('Firebase xato!','lose'); }
  })();
}
</script>
</body>
</html>
