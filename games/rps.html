<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>✂️ Tosh-Qaychi-Qog'oz</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{
  --bg:#0b1024;--card:#171f4a;--card2:#1d2658;
  --gold:#ffd740;--green:#22c55e;--red:#ef4444;
  --accent:#8b5cf6;--accent2:#22d3ee;
  --text:#eef2ff;--muted:#8b95c8;--border:rgba(255,255,255,0.08);
}
body{
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(139,92,246,0.20), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(34,211,238,0.12), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,20px));background:rgba(11,16,36,0.85);backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border)}
.back{background:rgba(255,255,255,0.06);border:1px solid var(--border);width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:var(--text);text-decoration:none}
.title{font-size:17px;font-weight:800}
.balance{background:linear-gradient(135deg,#ffd740,#ff9800);padding:8px 14px;border-radius:14px;font-weight:800;color:#1a0a00;font-size:13px}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}

.battle-stage{
  background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:24px;padding:22px 16px;text-align:center;margin-bottom:18px;
}
.battle-row{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;margin-bottom:16px}
.battle-side{display:flex;flex-direction:column;align-items:center;gap:6px}
.bs-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}
.bs-emoji{
  width:100px;height:100px;border-radius:24px;
  background:linear-gradient(160deg,#fff,#e2e8f0);
  display:flex;align-items:center;justify-content:center;font-size:60px;
  box-shadow:0 12px 30px rgba(0,0,0,0.4);color:#0b1024;
}
.bs-emoji.you{background:linear-gradient(160deg,#22d3ee,#0891b2);color:#fff}
.bs-emoji.bot{background:linear-gradient(160deg,#ef4444,#7f1d1d);color:#fff}
.bs-emoji.shake{animation:shake 0.6s ease-in-out}
@keyframes shake{
  0%,100%{transform:translateY(0) rotate(0)}
  25%{transform:translateY(-12px) rotate(-10deg)}
  75%{transform:translateY(-12px) rotate(10deg)}
}
.vs-text{font-size:26px;font-weight:900;color:var(--gold);text-shadow:0 0 12px rgba(255,215,64,0.5)}
.result-text{font-size:18px;font-weight:800;min-height:26px;margin-top:8px}
.result-text.win{color:var(--green)}
.result-text.lose{color:var(--red)}
.result-text.tie{color:var(--gold)}

.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.choice-btn{
  padding:18px 8px;border-radius:18px;border:2px solid var(--border);
  background:linear-gradient(160deg,var(--card2),var(--card));color:var(--text);
  cursor:pointer;font-weight:800;font-size:13px;transition:all 0.18s;
}
.choice-btn .em{font-size:42px;display:block;margin-bottom:4px}
.choice-btn:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.choice-btn:active{transform:scale(0.96)}
.choice-btn:disabled{opacity:0.5;cursor:not-allowed}

.bet-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.bet-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.bet-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bet-input{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;font-size:18px;font-weight:700;outline:none}
.preset{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}

.info-strip{display:flex;gap:12px;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--muted)}
.info-strip strong{color:var(--text);display:block;font-size:14px;margin-top:2px}

.note{background:rgba(255,215,64,0.08);border:1px solid rgba(255,215,64,0.2);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--muted);margin-top:12px;line-height:1.5}
.note strong{color:var(--gold)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;opacity:0;transition:all 0.25s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.win{border-color:rgba(34,197,94,0.5)}
.toast.lose{border-color:rgba(239,68,68,0.5)}
.toast.tie{border-color:rgba(255,215,64,0.5)}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="title">✂️ Tosh-Qaychi-Qog'oz</div>
  <div class="balance"><span id="bal">—</span> so'm</div>
</div>

<div class="wrap">
  <div class="battle-stage">
    <div class="battle-row">
      <div class="battle-side">
        <div class="bs-label">SIZ</div>
        <div class="bs-emoji you" id="youE">❓</div>
      </div>
      <div class="vs-text">VS</div>
      <div class="battle-side">
        <div class="bs-label">BOT</div>
        <div class="bs-emoji bot" id="botE">❓</div>
      </div>
    </div>
    <div class="result-text" id="result">Tanlovingizni qiling!</div>
  </div>

  <div class="bet-card">
    <div class="bet-label">Stavka (so'm)</div>
    <div class="bet-row">
      <input class="bet-input" id="betInput" type="number" inputmode="numeric" pattern="[0-9]*" min="10" step="1" value="100" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="bet-row">
      <button class="preset" data-v="100">100</button>
      <button class="preset" data-v="500">500</button>
      <button class="preset" data-v="1000">1 000</button>
      <button class="preset" data-v="5000">5 000</button>
      <button class="preset" data-v="all">MAX</button>
    </div>

    <div class="bet-label">Tanlang</div>
    <div class="choices">
      <button class="choice-btn" data-c="rock"><span class="em">🪨</span>Tosh</button>
      <button class="choice-btn" data-c="paper"><span class="em">📄</span>Qog'oz</button>
      <button class="choice-btn" data-c="scissors"><span class="em">✂️</span>Qaychi</button>
    </div>

    <div class="note">
      💡 <strong>Yutuq:</strong> ×1.95 · Durang: pul qaytadi · Mag'lub: stavka kuyadi
    </div>

    <div class="info-strip">
      <div>O'yinlar<strong id="games">0</strong></div>
      <div>Yutuqlar<strong id="wins">0</strong></div>
      <div>Mag'lub<strong id="losses">0</strong></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getCurrentUser, initUser, watchUser, changeBalance, logGame, fmtMoney
} from '../js/firebase-shared.js?v=2.5.0';

const $ = s => document.querySelector(s);
function showToast(msg,type=''){
  const t=$('#toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

const EM = { rock:'🪨', paper:'📄', scissors:'✂️' };
const WIN_MULT = 1.95;

let balance = 0;
let busy = false;
let stats = { games:0, wins:0, losses:0 };
const user = getCurrentUser();

function updBal(){ $('#bal').textContent = fmtMoney(balance); }
function updStats(){
  $('#games').textContent = stats.games;
  $('#wins').textContent = stats.wins;
  $('#losses').textContent = stats.losses;
}

document.querySelectorAll('.preset').forEach(b=>{
  b.addEventListener('click',()=>{
    const v = b.dataset.v;
    if (v === 'all') $('#betInput').value = Math.max(10, Math.floor(balance));
    else $('#betInput').value = v;
  });
});

function decide(you, bot){
  if (you === bot) return 'tie';
  if ((you==='rock' && bot==='scissors') ||
      (you==='paper' && bot==='rock') ||
      (you==='scissors' && bot==='paper')) return 'win';
  return 'lose';
}

async function play(choice){
  if (busy) return;
  if (!user){ showToast('Tizimga kiring!','lose'); return; }
  const bet = Math.floor(parseFloat($('#betInput').value)||0);
  if (bet < 10){ showToast("Minimum 10 so'm",'lose'); return; }
  if (bet > balance){ showToast('Balans yetarli emas!','lose'); return; }

  busy = true;
  document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=true);
  $('#result').textContent = 'O\'ynayapti...';
  $('#result').className = 'result-text';

  try { await changeBalance(user.name, -bet, { isBet:true }); }
  catch(e){ busy=false; document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=false); showToast('Xato!','lose'); return; }

  const youE = $('#youE'), botE = $('#botE');
  youE.textContent = '❓'; botE.textContent = '❓';
  youE.classList.add('shake'); botE.classList.add('shake');

  const choices = ['rock','paper','scissors'];
  const shakeInt = setInterval(()=>{
    youE.textContent = EM[choices[Math.floor(Math.random()*3)]];
    botE.textContent = EM[choices[Math.floor(Math.random()*3)]];
  }, 100);

  setTimeout(async ()=>{
    clearInterval(shakeInt);
    youE.classList.remove('shake'); botE.classList.remove('shake');
    const bot = choices[Math.floor(Math.random()*3)];
    youE.textContent = EM[choice];
    botE.textContent = EM[bot];

    const res = decide(choice, bot);
    stats.games++;
    if (res === 'win'){
      const winAmount = Math.floor(bet * WIN_MULT);
      await changeBalance(user.name, +winAmount, { isWin:true, gameEnd:true });
      await logGame(user.name, 'rps', bet, winAmount, WIN_MULT);
      stats.wins++;
      $('#result').textContent = `🎉 Yutdingiz! +${fmtMoney(winAmount - bet)} so'm`;
      $('#result').className = 'result-text win';
      showToast(`+${fmtMoney(winAmount - bet)} so'm`,'win');
    } else if (res === 'tie'){
      await changeBalance(user.name, +bet, { gameEnd:true }); // pul qaytdi
      await logGame(user.name, 'rps', bet, bet, 1);
      $('#result').textContent = `🤝 Durang — pul qaytdi`;
      $('#result').className = 'result-text tie';
      showToast('Durang','tie');
    } else {
      await changeBalance(user.name, 0, { gameEnd:true });
      await logGame(user.name, 'rps', bet, 0, 0);
      stats.losses++;
      $('#result').textContent = `😔 Mag'lub! −${fmtMoney(bet)} so'm`;
      $('#result').className = 'result-text lose';
      showToast(`−${fmtMoney(bet)} so'm`,'lose');
    }
    updStats();
    busy = false;
    document.querySelectorAll('.choice-btn').forEach(b=>b.disabled=false);
  }, 1200);
}

document.querySelectorAll('.choice-btn').forEach(b=>{
  b.addEventListener('click', ()=>play(b.dataset.c));
});

if (!user){
  showToast('Tizimga kiring!','lose');
  $('#bal').textContent = '0';
} else {
  (async ()=>{
    try {
      const res = await initUser(user.name);
      balance = Number(res.data.balance) || 0;
      updBal();
      watchUser(user.name, (data)=>{
        if (!data) return;
        balance = Number(data.balance) || 0; updBal();
      });
    } catch(e){ console.error(e); showToast('Firebase xato!','lose'); }
  })();
}
</script>
</body>
</html>
