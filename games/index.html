<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>🎮 O'yinlar — Jamoa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{
  --bg:#0b1024; --bg2:#10173a; --card:#171f4a; --card2:#1d2658;
  --gold:#ffd740; --green:#22c55e; --red:#ef4444;
  --accent:#8b5cf6; --accent2:#22d3ee;
  --text:#eef2ff; --muted:#8b95c8; --border:rgba(255,255,255,0.08);
}
html,body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body{
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(139,92,246,0.20), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(34,211,238,0.12), transparent 60%),
    var(--bg);
  padding-bottom:32px;
}

/* HEADER */
.gh-header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(11,16,36,0.85);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;
  border-bottom:1px solid var(--border);
}
.gh-back{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text);cursor:pointer;text-decoration:none;
}
.gh-back svg{width:20px;height:20px}
.gh-title{font-size:18px;font-weight:800;letter-spacing:0.4px}
.gh-balance{
  display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#ffd740,#ff9800);
  padding:8px 14px;border-radius:14px;font-weight:800;color:#1a0a00;font-size:14px;
  box-shadow:0 6px 18px rgba(255,152,0,0.35);
}
.gh-balance .coin{font-size:18px}

/* USER STRIP */
.user-strip{
  margin:18px;background:linear-gradient(135deg, rgba(139,92,246,0.25), rgba(34,211,238,0.15));
  border:1px solid rgba(139,92,246,0.35);border-radius:20px;padding:16px 18px;
  display:flex;align-items:center;gap:14px;
}
.us-avatar{
  width:54px;height:54px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;color:#fff;
  box-shadow:0 8px 22px rgba(139,92,246,0.4);
}
.us-info{flex:1;min-width:0}
.us-name{font-size:16px;font-weight:800;margin-bottom:2px}
.us-bal{font-size:13px;color:var(--gold);font-weight:700}
.us-rank{
  background:rgba(255,215,64,0.15);color:var(--gold);
  padding:6px 10px;border-radius:10px;font-size:12px;font-weight:700;border:1px solid rgba(255,215,64,0.25);
}
.us-rank.gold{background:linear-gradient(135deg,#ffd740,#ff9800);color:#1a0a00;border-color:transparent}

/* BONUS BANNER */
.bonus-banner{
  margin:0 18px 18px;background:linear-gradient(135deg, rgba(34,197,94,0.22), rgba(34,197,94,0.08));
  border:1px solid rgba(34,197,94,0.35);border-radius:16px;padding:12px 16px;
  display:flex;align-items:center;gap:12px;font-size:13px;
}
.bonus-banner .em{font-size:22px}
.bonus-banner strong{color:var(--green)}

/* SECTION TITLE */
.section-title{
  display:flex;align-items:center;justify-content:space-between;
  padding:6px 22px 12px;
}
.section-title h2{font-size:14px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}

/* GAMES GRID */
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;padding:0 18px 24px}
.game-card{
  position:relative;border-radius:20px;overflow:hidden;
  background:linear-gradient(160deg, var(--card2), var(--card));
  border:1px solid var(--border);padding:18px 16px 16px;cursor:pointer;
  text-decoration:none;color:var(--text);
  transition:transform 0.18s, box-shadow 0.2s;
  min-height:160px;display:flex;flex-direction:column;justify-content:space-between;
}
.game-card:active{transform:scale(0.97)}
.game-card .gc-emoji{font-size:42px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,0.35))}
.game-card .gc-title{font-size:16px;font-weight:800;margin-top:10px}
.game-card .gc-desc{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4}
.game-card .gc-tag{
  position:absolute;top:12px;right:12px;
  background:rgba(0,0,0,0.35);color:var(--gold);
  font-size:10px;font-weight:700;padding:4px 8px;border-radius:8px;letter-spacing:0.5px;
}
.game-card.aviator{background:linear-gradient(160deg,#0a1a3a,#1e0a3a)}
.game-card.aviator::after{
  content:'';position:absolute;inset:0;
  background:radial-gradient(circle at 80% 20%, rgba(0,229,255,0.18), transparent 60%);
  pointer-events:none;
}
.game-card.soon{opacity:0.7}
.game-card.soon .gc-tag{background:rgba(239,68,68,0.2);color:#fca5a5}

/* LEADERBOARD */
.leaderboard{margin:0 18px;background:var(--card);border-radius:20px;border:1px solid var(--border);overflow:hidden}
.lb-header{padding:14px 18px;border-bottom:1px solid var(--border);background:rgba(0,0,0,0.18);
  display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px}
.lb-header .em{font-size:18px}
.lb-list{max-height:480px;overflow-y:auto}
.lb-item{
  display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
}
.lb-item:last-child{border-bottom:none}
.lb-item.me{background:linear-gradient(90deg, rgba(139,92,246,0.18), transparent)}
.lb-rank{
  width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:14px;background:rgba(255,255,255,0.06);color:var(--muted);
}
.lb-rank.r1{background:linear-gradient(135deg,#ffd740,#ff9800);color:#1a0a00}
.lb-rank.r2{background:linear-gradient(135deg,#cbd5e1,#94a3b8);color:#0b1024}
.lb-rank.r3{background:linear-gradient(135deg,#fb923c,#c2410c);color:#fff}
.lb-name{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-stats{font-size:11px;color:var(--muted);font-weight:500}
.lb-bal{font-weight:800;color:var(--gold);font-size:14px;white-space:nowrap}

.empty{padding:30px 18px;text-align:center;color:var(--muted);font-size:13px}

/* Login prompt */
.login-prompt{
  margin:40px 18px;padding:30px 22px;border-radius:20px;text-align:center;
  background:linear-gradient(135deg, rgba(139,92,246,0.18), rgba(34,211,238,0.10));
  border:1px solid rgba(139,92,246,0.30);
}
.login-prompt h3{font-size:18px;margin-bottom:8px}
.login-prompt p{font-size:13px;color:var(--muted);margin-bottom:16px;line-height:1.5}
.login-prompt a{
  display:inline-block;background:linear-gradient(135deg,var(--accent),#6d28d9);
  color:#fff;padding:12px 28px;border-radius:14px;text-decoration:none;font-weight:700;
}

/* Toast */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
  background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:14px;
  font-weight:600;font-size:14px;z-index:200;opacity:0;transition:opacity 0.25s,transform 0.25s;
  pointer-events:none;border:1px solid var(--border);
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.success{border-color:rgba(34,197,94,0.5)}

@media (max-width:380px){
  .games-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="gh-header">
  <a href="../index.html" class="gh-back" aria-label="Orqaga">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <div class="gh-title">🎮 O'yinlar</div>
  <div class="gh-balance"><span class="coin">💰</span><span id="hdr-balance">—</span></div>
</header>

<div id="content">
  <!-- USER STRIP / LOGIN PROMPT -->
  <div id="user-area"></div>

  <!-- BONUS BANNER (agar bonus berilsa) -->
  <div id="bonus-area"></div>

  <!-- GAMES -->
  <div class="section-title"><h2>🕹 Mavjud o'yinlar</h2></div>
  <div class="games-grid">
    <a href="aviator.html" class="game-card aviator">
      <span class="gc-tag">HIT</span>
      <div>
        <div class="gc-emoji">✈️</div>
        <div class="gc-title">Aviator</div>
        <div class="gc-desc">Samolyot uchadi — kerakli vaqtda chiqing!</div>
      </div>
    </a>
    <a href="dice.html" class="game-card">
      <span class="gc-tag">NEW</span>
      <div>
        <div class="gc-emoji">🎲</div>
        <div class="gc-title">Zar</div>
        <div class="gc-desc">Yuqori yoki past — taxmin qiling</div>
      </div>
    </a>
    <a href="coinflip.html" class="game-card">
      <span class="gc-tag">x2</span>
      <div>
        <div class="gc-emoji">🪙</div>
        <div class="gc-title">Tanga</div>
        <div class="gc-desc">Yer / Bosh — 50/50 chiquvchi</div>
      </div>
    </a>
    <div class="game-card soon">
      <span class="gc-tag">TEZDA</span>
      <div>
        <div class="gc-emoji">🎰</div>
        <div class="gc-title">Slots</div>
        <div class="gc-desc">Tez orada qo'shiladi</div>
      </div>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div class="section-title"><h2>🏆 Reyting (real-time)</h2></div>
  <div class="leaderboard">
    <div class="lb-header"><span class="em">👑</span> Eng boy o'yinchilar</div>
    <div class="lb-list" id="lb-list">
      <div class="empty">Yuklanmoqda...</div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getCurrentUser, initUser, watchUser, watchLeaderboard, fmtMoney, DAILY_BONUS, START_BALANCE
} from '../js/firebase-shared.js?v=2.3.0';

function $(s){return document.querySelector(s)}
function showToast(msg, type=''){
  const t = $('#toast'); t.textContent = msg; t.className = 'toast ' + type; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}
window.showToast = showToast;

function getInitials(name){
  if(!name) return '?';
  const p = String(name).trim().split(/\s+/);
  if(p.length===1) return p[0][0].toUpperCase();
  return (p[0][0]+p[p.length-1][0]).toUpperCase();
}

const user = getCurrentUser();

if (!user) {
  $('#user-area').innerHTML = `
    <div class="login-prompt">
      <h3>🔒 Tizimga kiring</h3>
      <p>O'yinlarda qatnashish va reytingda paydo bo'lish uchun avval asosiy ilovaga kirib o'zingizni tanlang.</p>
      <a href="../index.html">Asosiyga qaytish →</a>
    </div>
  `;
  $('#hdr-balance').textContent = '—';
} else {
  // User strip
  $('#user-area').innerHTML = `
    <div class="user-strip">
      <div class="us-avatar">${getInitials(user.name)}</div>
      <div class="us-info">
        <div class="us-name">${user.name}</div>
        <div class="us-bal" id="us-bal">— so'm</div>
      </div>
      <div class="us-rank" id="us-rank">#—</div>
    </div>
  `;

  // Init user va kunlik bonus tekshirish
  (async () => {
    try {
      const res = await initUser(user.name);
      if (res.bonusGiven) {
        const isStart = res.data.gamesPlayed === 0 && res.bonusAmount === START_BALANCE;
        const msg = isStart
          ? `🎉 Tabriklaymiz! Sizga boshlang'ich balans: ${fmtMoney(res.bonusAmount)} so'm`
          : `🎁 Kunlik bonus: +${fmtMoney(res.bonusAmount)} so'm`;
        showToast(msg, 'success');
        $('#bonus-area').innerHTML = `
          <div class="bonus-banner">
            <div class="em">${isStart ? '🎉' : '🎁'}</div>
            <div>
              ${isStart ? "Boshlang'ich balans" : 'Bugungi bonus'}: <strong>+${fmtMoney(res.bonusAmount)} so'm</strong><br>
              <span style="color:var(--muted);font-size:11px">Har kuni ${fmtMoney(DAILY_BONUS)} so'm bepul!</span>
            </div>
          </div>
        `;
      }
    } catch(e) {
      console.error(e);
      showToast('Firebase ulanmadi — internetni tekshiring', '');
    }
  })();

  // Real-time balans
  watchUser(user.name, (data) => {
    if (!data) return;
    const bal = fmtMoney(data.balance || 0);
    $('#hdr-balance').textContent = bal + ' so\'m';
    const usBal = $('#us-bal'); if (usBal) usBal.textContent = bal + ' so\'m';
  });
}

// Real-time leaderboard
watchLeaderboard((list) => {
  const box = $('#lb-list');
  if (!list || list.length === 0) {
    box.innerHTML = '<div class="empty">Hali hech kim o\'ynamagan</div>';
    return;
  }
  // Mening rang
  if (user) {
    const idx = list.findIndex(u => u.name && u.name.toLowerCase() === user.name.toLowerCase());
    const rankEl = $('#us-rank');
    if (rankEl) {
      if (idx >= 0) {
        rankEl.textContent = '#' + (idx + 1);
        if (idx === 0) rankEl.classList.add('gold');
        else rankEl.classList.remove('gold');
      } else {
        rankEl.textContent = '#—';
      }
    }
  }

  const html = list.slice(0, 50).map((u, i) => {
    const rank = i + 1;
    const rankCls = rank===1?'r1':rank===2?'r2':rank===3?'r3':'';
    const isMe = user && u.name && u.name.toLowerCase() === user.name.toLowerCase();
    return `
      <div class="lb-item ${isMe?'me':''}">
        <div class="lb-rank ${rankCls}">${rank<=3?(rank===1?'🥇':rank===2?'🥈':'🥉'):rank}</div>
        <div style="flex:1;min-width:0">
          <div class="lb-name">${u.name}${isMe?' <span style="color:var(--accent2);font-size:11px">(siz)</span>':''}</div>
          <div class="lb-stats">${u.gamesPlayed||0} o'yin · jami yutuq: ${fmtMoney(u.totalWon||0)}</div>
        </div>
        <div class="lb-bal">${fmtMoney(u.balance)} so'm</div>
      </div>
    `;
  }).join('');
  box.innerHTML = html;
});
</script>
</body>
</html>
