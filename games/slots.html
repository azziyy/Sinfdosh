<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>🎰 Slots — Jamoa O'yinlari</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{
  --bg:#0b1024;--card:#171f4a;--card2:#1d2658;
  --gold:#ffd740;--green:#22c55e;--red:#ef4444;
  --accent:#8b5cf6;--accent2:#22d3ee;
  --text:#eef2ff;--muted:#8b95c8;--border:rgba(255,255,255,0.08);
}
body{
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(255,215,64,0.18), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(239,68,68,0.10), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;padding-top:calc(14px + env(safe-area-inset-top,20px));
  background:rgba(11,16,36,0.85);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);
}
.back{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text);text-decoration:none;
}
.title{font-size:17px;font-weight:800}
.balance{background:linear-gradient(135deg,#ffd740,#ff9800);padding:8px 14px;border-radius:14px;font-weight:800;color:#1a0a00;font-size:13px}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}

.slot-machine{
  background:linear-gradient(160deg,#3a1810,#5c1a0a 50%,#3a1810);
  border:3px solid #ffd740;
  border-radius:28px;padding:24px 18px;text-align:center;margin-bottom:18px;
  box-shadow:0 20px 50px rgba(0,0,0,0.5), inset 0 4px 14px rgba(255,215,64,0.15);
  position:relative;overflow:hidden;
}
.slot-machine::before{
  content:'';position:absolute;inset:0;
  background:
    repeating-linear-gradient(45deg,
      transparent 0,
      transparent 14px,
      rgba(255,215,64,0.04) 14px,
      rgba(255,215,64,0.04) 16px);
  pointer-events:none;
}
.slot-top{
  font-size:22px;font-weight:900;color:#ffd740;letter-spacing:3px;
  text-shadow:0 0 18px rgba(255,215,64,0.6);margin-bottom:14px;
}
.reels{
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  background:#0b0610;border-radius:18px;padding:14px;
  box-shadow:inset 0 4px 18px rgba(0,0,0,0.7);
  margin-bottom:14px;position:relative;z-index:1;
}
.reel{
  height:110px;background:linear-gradient(180deg,#fff,#e2e8f0);
  border-radius:12px;overflow:hidden;position:relative;
  box-shadow:inset 0 2px 8px rgba(0,0,0,0.3);
}
.reel-strip{
  display:flex;flex-direction:column;align-items:center;
  transition:transform 0.1s linear;
}
.reel-cell{
  height:110px;display:flex;align-items:center;justify-content:center;
  font-size:62px;line-height:1;
}
.reel.spinning .reel-strip{
  animation:spinReel 0.08s linear infinite;
}
@keyframes spinReel{
  0%{transform:translateY(0)}
  100%{transform:translateY(-110px)}
}
.payline{
  position:absolute;left:0;right:0;top:50%;height:3px;
  background:linear-gradient(90deg,transparent,#ffd740,transparent);
  z-index:2;pointer-events:none;opacity:0.6;
}
.sum-display{font-size:20px;font-weight:900;color:#ffd740;margin-bottom:6px;letter-spacing:1px;min-height:26px;position:relative;z-index:1}
.result-text{font-size:15px;font-weight:700;min-height:22px;color:#fff;position:relative;z-index:1}
.result-text.win{color:#22c55e;text-shadow:0 0 14px rgba(34,197,94,0.6)}
.result-text.lose{color:#fca5a5}
.result-text.jackpot{
  color:#ffd740;font-size:18px;
  text-shadow:0 0 18px rgba(255,215,64,0.8);
  animation:jackpotPulse 0.8s ease-in-out infinite alternate;
}
@keyframes jackpotPulse{
  0%{transform:scale(1)}
  100%{transform:scale(1.08)}
}

.bet-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.bet-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.bet-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bet-input{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;font-size:18px;font-weight:700;outline:none}
.bet-input:focus{border-color:var(--gold)}
.preset{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}
.preset:active{transform:scale(0.96)}

.spin-btn{
  width:100%;padding:18px;border:none;border-radius:14px;
  background:linear-gradient(135deg,#ef4444,#b91c1c);
  color:#fff;font-weight:900;font-size:18px;cursor:pointer;letter-spacing:1px;
  box-shadow:0 10px 28px rgba(239,68,68,0.45);text-transform:uppercase;
}
.spin-btn:active{transform:scale(0.98)}
.spin-btn:disabled{opacity:0.55;cursor:not-allowed}

.paytable{
  background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:14px 18px;margin-top:14px;
}
.pt-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}
.pt-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;font-size:13px;font-weight:600}
.pt-row{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;background:var(--card2);border-radius:10px}
.pt-row .sym{font-size:18px}
.pt-row .mul{color:var(--gold);font-weight:800}

.info-strip{display:flex;gap:12px;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--muted)}
.info-strip strong{color:var(--text);display:block;font-size:14px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;opacity:0;transition:all 0.25s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.win{border-color:rgba(34,197,94,0.5)}
.toast.lose{border-color:rgba(239,68,68,0.5)}
.toast.jackpot{border-color:rgba(255,215,64,0.7);background:linear-gradient(135deg,#ffd740,#ff9800);color:#1a0a00}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="title">🎰 Slots</div>
  <div class="balance"><span id="bal">—</span> so'm</div>
</div>

<div class="wrap">
  <div class="slot-machine">
    <div class="slot-top">★ LUCKY 7 ★</div>
    <div class="reels">
      <div class="reel" id="r1"><div class="reel-strip"><div class="reel-cell">🍒</div></div></div>
      <div class="reel" id="r2"><div class="reel-strip"><div class="reel-cell">🍋</div></div></div>
      <div class="reel" id="r3"><div class="reel-strip"><div class="reel-cell">🔔</div></div></div>
      <div class="payline"></div>
    </div>
    <div class="sum-display" id="sumDisp">— — —</div>
    <div class="result-text" id="result">Stavkangizni qo'ying va aylantiring!</div>
  </div>

  <div class="bet-card">
    <div class="bet-label">Stavka (so'm)</div>
    <div class="bet-row">
      <input class="bet-input" id="betInput" type="number" inputmode="numeric" pattern="[0-9]*" min="10" step="1" value="100" oninput="this.value=this.value.replace(/[^0-9]/g,'')">
    </div>
    <div class="bet-row">
      <button class="preset" data-v="100">100</button>
      <button class="preset" data-v="500">500</button>
      <button class="preset" data-v="1000">1 000</button>
      <button class="preset" data-v="5000">5 000</button>
      <button class="preset" data-v="all">MAX</button>
    </div>

    <button class="spin-btn" id="spinBtn">🎰 SPIN!</button>

    <div class="info-strip">
      <div>O'yinlar<strong id="games">0</strong></div>
      <div>Yutuqlar<strong id="wins">0</strong></div>
      <div>Mag'lub<strong id="losses">0</strong></div>
    </div>
  </div>

  <div class="paytable">
    <div class="pt-title">💰 Yutuq jadvali (3 ta bir xil)</div>
    <div class="pt-grid">
      <div class="pt-row"><span class="sym">7️⃣7️⃣7️⃣</span><span class="mul">×50 JACKPOT</span></div>
      <div class="pt-row"><span class="sym">💎💎💎</span><span class="mul">×25</span></div>
      <div class="pt-row"><span class="sym">⭐⭐⭐</span><span class="mul">×15</span></div>
      <div class="pt-row"><span class="sym">🔔🔔🔔</span><span class="mul">×10</span></div>
      <div class="pt-row"><span class="sym">🍉🍉🍉</span><span class="mul">×8</span></div>
      <div class="pt-row"><span class="sym">🍒🍒🍒</span><span class="mul">×5</span></div>
      <div class="pt-row"><span class="sym">🍋🍋🍋</span><span class="mul">×4</span></div>
      <div class="pt-row"><span class="sym">2 bir xil</span><span class="mul">×1.5</span></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getCurrentUser, initUser, watchUser, changeBalance, logGame, fmtMoney
} from '../js/firebase-shared.js?v=2.5.0';

const $ = s => document.querySelector(s);
function showToast(msg,type=''){
  const t=$('#toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2600);
}

// Belgilar va vazn (kam bo'lgan belgilar — kamroq chiqadi)
const SYMBOLS = [
  { s:'7️⃣', mult:50, w:1  },   // jackpot
  { s:'💎', mult:25, w:2  },
  { s:'⭐', mult:15, w:3  },
  { s:'🔔', mult:10, w:5  },
  { s:'🍉', mult:8,  w:7  },
  { s:'🍒', mult:5,  w:10 },
  { s:'🍋', mult:4,  w:12 }
];
const TOTAL_W = SYMBOLS.reduce((a,b)=>a+b.w,0);

function pickSymbol(){
  let r = Math.random()*TOTAL_W;
  for (const s of SYMBOLS){
    if (r < s.w) return s;
    r -= s.w;
  }
  return SYMBOLS[SYMBOLS.length-1];
}

let balance = 0;
let busy = false;
let stats = { games:0, wins:0, losses:0 };
const user = getCurrentUser();

function updBal(){ $('#bal').textContent = fmtMoney(balance); }
function updStats(){
  $('#games').textContent = stats.games;
  $('#wins').textContent = stats.wins;
  $('#losses').textContent = stats.losses;
}

document.querySelectorAll('.preset').forEach(b=>{
  b.addEventListener('click',()=>{
    const v = b.dataset.v;
    if (v === 'all') $('#betInput').value = Math.max(10, Math.floor(balance));
    else $('#betInput').value = v;
  });
});

function setReel(id, symbol){
  const reel = document.getElementById(id);
  reel.innerHTML = `<div class="reel-strip"><div class="reel-cell">${symbol}</div></div>`;
}

async function spin(){
  if (busy) return;
  if (!user) { showToast('Tizimga kiring!','lose'); return; }
  const bet = Math.floor(parseFloat($('#betInput').value)||0);
  if (bet < 10) { showToast("Minimum 10 so'm",'lose'); return; }
  if (bet > balance) { showToast('Balans yetarli emas!','lose'); return; }

  busy = true; $('#spinBtn').disabled = true;
  $('#result').textContent = 'Aylanmoqda...';
  $('#result').className = 'result-text';
  $('#sumDisp').textContent = '— — —';

  try { await changeBalance(user.name, -bet, { isBet:true }); }
  catch(e){ busy=false; $('#spinBtn').disabled=false; showToast('Xato!','lose'); return; }

  // Reellarni aylantirish — har biri vizual
  const reels = ['r1','r2','r3'];
  reels.forEach(id => {
    const reel = document.getElementById(id);
    reel.classList.add('spinning');
    // Tasodifiy belgilarni o'tkazib turish
    const cycle = setInterval(()=>{
      const sym = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)].s;
      setReel(id, sym);
    }, 80);
    reel._cycle = cycle;
  });

  // Har bir reel ketma-ket to'xtaydi (real slot mashinasi effekti)
  const finalSymbols = [pickSymbol(), pickSymbol(), pickSymbol()];
  const stopTimes = [900, 1400, 1900];

  for (let i = 0; i < 3; i++){
    setTimeout(() => {
      const reel = document.getElementById(reels[i]);
      clearInterval(reel._cycle);
      reel.classList.remove('spinning');
      setReel(reels[i], finalSymbols[i].s);
    }, stopTimes[i]);
  }

  setTimeout(async () => {
    const [a,b,c] = finalSymbols;
    $('#sumDisp').textContent = `${a.s} ${b.s} ${c.s}`;

    // Yutuq hisoblash
    let mult = 0;
    let label = '';
    if (a.s === b.s && b.s === c.s){
      mult = a.mult;
      label = (a.s === '7️⃣') ? '🎰 JACKPOT! 🎰' : `🎉 3x ${a.s}!`;
    } else if (a.s === b.s || b.s === c.s || a.s === c.s){
      mult = 1.5;
      label = `✨ 2 bir xil!`;
    }

    stats.games++;
    if (mult > 0){
      const winAmount = Math.floor(bet * mult);
      await changeBalance(user.name, +winAmount, { isWin:true, gameEnd:true });
      await logGame(user.name, 'slots', bet, winAmount, mult);
      stats.wins++;
      const isJackpot = (a.s === '7️⃣' && b.s === '7️⃣' && c.s === '7️⃣');
      $('#result').textContent = `${label}  +${fmtMoney(winAmount - bet)} so'm (×${mult})`;
      $('#result').className = 'result-text ' + (isJackpot ? 'jackpot' : 'win');
      showToast(`+${fmtMoney(winAmount - bet)} so'm`, isJackpot ? 'jackpot' : 'win');
    } else {
      await changeBalance(user.name, 0, { gameEnd:true });
      await logGame(user.name, 'slots', bet, 0, 0);
      stats.losses++;
      $('#result').textContent = `😔 Yutuq yo'q − ${fmtMoney(bet)} so'm`;
      $('#result').className = 'result-text lose';
      showToast(`−${fmtMoney(bet)} so'm`,'lose');
    }
    updStats();
    busy = false; $('#spinBtn').disabled = false;
  }, 2050);
}

$('#spinBtn').addEventListener('click', spin);

if (!user){
  showToast('Tizimga kiring!','lose');
  $('#bal').textContent = '0';
} else {
  (async ()=>{
    try {
      const res = await initUser(user.name);
      balance = Number(res.data.balance) || 0;
      updBal();
      watchUser(user.name, (data)=>{
        if (!data) return;
        balance = Number(data.balance) || 0; updBal();
      });
    } catch(e){ console.error(e); showToast('Firebase xato!','lose'); }
  })();
}
</script>
</body>
</html>
