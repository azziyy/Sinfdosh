<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b1024">
<title>🎲 Zar — Jamoa O'yinlari</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
:root{
  --bg:#0b1024;--card:#171f4a;--card2:#1d2658;
  --gold:#ffd740;--green:#22c55e;--red:#ef4444;
  --accent:#8b5cf6;--accent2:#22d3ee;
  --text:#eef2ff;--muted:#8b95c8;--border:rgba(255,255,255,0.08);
}
body{
  background:
    radial-gradient(1200px 600px at 80% -100px, rgba(139,92,246,0.20), transparent 60%),
    radial-gradient(900px 500px at -100px 30%, rgba(34,211,238,0.12), transparent 60%),
    var(--bg);
  color:var(--text);min-height:100vh;
}
.header{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px;background:rgba(11,16,36,0.85);
  backdrop-filter:blur(14px);position:sticky;top:0;z-index:30;border-bottom:1px solid var(--border);
}
.back{
  background:rgba(255,255,255,0.06);border:1px solid var(--border);
  width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  color:var(--text);text-decoration:none;
}
.title{font-size:17px;font-weight:800}
.balance{background:linear-gradient(135deg,#ffd740,#ff9800);padding:8px 14px;border-radius:14px;font-weight:800;color:#1a0a00;font-size:13px}
.wrap{max-width:480px;margin:0 auto;padding:20px 18px 40px}

.dice-stage{
  background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--border);
  border-radius:24px;padding:24px 20px;text-align:center;margin-bottom:18px;
}
.dice-row{display:flex;justify-content:center;gap:20px;margin:10px 0 20px}
.dice{
  width:90px;height:90px;border-radius:18px;background:#fff;color:#0b1024;
  display:flex;align-items:center;justify-content:center;font-size:54px;font-weight:900;
  box-shadow:0 14px 30px rgba(0,0,0,0.4),inset 0 -6px 14px rgba(0,0,0,0.15);
  transition:transform 0.1s;
}
.dice.rolling{animation:roll 1.5s ease-in-out}
@keyframes roll{
  0%{transform:rotate(0) scale(1)}
  25%{transform:rotate(180deg) scale(1.1)}
  50%{transform:rotate(360deg) scale(0.95)}
  75%{transform:rotate(540deg) scale(1.05)}
  100%{transform:rotate(720deg) scale(1)}
}
.sum-display{font-size:32px;font-weight:900;color:var(--gold);margin-bottom:6px;letter-spacing:1px}
.result-text{font-size:17px;font-weight:700;min-height:24px}
.result-text.win{color:var(--green)}
.result-text.lose{color:var(--red)}

.bet-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:18px}
.bet-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:8px}
.bet-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.bet-input{flex:1;min-width:140px;background:var(--card2);border:1px solid var(--border);color:var(--text);padding:14px 16px;border-radius:14px;font-size:18px;font-weight:700;outline:none}
.bet-input:focus{border-color:var(--accent)}
.preset{background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer}

.choice-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:14px 0}
.choice{
  padding:14px 8px;border-radius:14px;border:2px solid var(--border);background:var(--card2);
  cursor:pointer;text-align:center;font-weight:800;transition:all 0.18s;font-size:12px;
}
.choice .em{font-size:24px;display:block;margin-bottom:2px}
.choice .x{font-size:11px;color:var(--gold);display:block;margin-top:2px;font-weight:700}
.choice.active{
  border-color:var(--gold);background:linear-gradient(135deg,rgba(255,215,64,0.18),rgba(255,152,0,0.10));
  box-shadow:0 8px 24px rgba(255,152,0,0.20);
}

.roll-btn{
  width:100%;padding:16px;border:none;border-radius:14px;
  background:linear-gradient(135deg,var(--accent2),#0891b2);
  color:#04141a;font-weight:800;font-size:16px;cursor:pointer;letter-spacing:0.5px;
  box-shadow:0 10px 24px rgba(34,211,238,0.35);
}
.roll-btn:active{transform:scale(0.98)}
.roll-btn:disabled{opacity:0.5;cursor:not-allowed}

.info-strip{display:flex;gap:12px;justify-content:space-around;margin-top:14px;font-size:12px;color:var(--muted)}
.info-strip strong{color:var(--text);display:block;font-size:14px;margin-top:2px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(0,0,0,0.85);color:#fff;padding:12px 20px;border-radius:14px;font-weight:600;font-size:14px;z-index:200;opacity:0;transition:all 0.25s;pointer-events:none;border:1px solid var(--border)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
.toast.win{border-color:rgba(34,197,94,0.5)}
.toast.lose{border-color:rgba(239,68,68,0.5)}
</style>
</head>
<body>

<div class="header">
  <a href="index.html" class="back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></a>
  <div class="title">🎲 Zar o'yini</div>
  <div class="balance"><span id="bal">—</span> so'm</div>
</div>

<div class="wrap">
  <div class="dice-stage">
    <div class="dice-row">
      <div class="dice" id="d1">🎲</div>
      <div class="dice" id="d2">🎲</div>
    </div>
    <div class="sum-display" id="sumDisp">— + — = —</div>
    <div class="result-text" id="result">Stavkangizni qo'ying!</div>
  </div>

  <div class="bet-card">
    <div class="bet-label">Taxminingiz (2 zar yig'indisi)</div>
    <div class="choice-row">
      <div class="choice active" data-side="low">
        <span class="em">⬇️</span> Past (2-6) <span class="x">×2.4</span>
      </div>
      <div class="choice" data-side="seven">
        <span class="em">7️⃣</span> Aniq 7 <span class="x">×5.0</span>
      </div>
      <div class="choice" data-side="high">
        <span class="em">⬆️</span> Yuqori (8-12) <span class="x">×2.4</span>
      </div>
    </div>

    <div class="bet-label">Stavka (so'm)</div>
    <div class="bet-row">
      <input class="bet-input" id="betInput" type="number" min="10" step="10" value="100">
    </div>
    <div class="bet-row">
      <button class="preset" data-v="100">100</button>
      <button class="preset" data-v="500">500</button>
      <button class="preset" data-v="1000">1 000</button>
      <button class="preset" data-v="5000">5 000</button>
      <button class="preset" data-v="all">MAX</button>
    </div>

    <button class="roll-btn" id="rollBtn">🎲 Otish!</button>

    <div class="info-strip">
      <div>O'yinlar<strong id="games">0</strong></div>
      <div>Yutuqlar<strong id="wins">0</strong></div>
      <div>Mag'lub<strong id="losses">0</strong></div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module">
import {
  getCurrentUser, initUser, watchUser, changeBalance, logGame, fmtMoney
} from '../js/firebase-shared.js?v=2.3.0';

const $ = s => document.querySelector(s);
function showToast(msg,type=''){
  const t=$('#toast');t.textContent=msg;t.className='toast '+type;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

const DICE_FACES = ['⚀','⚁','⚂','⚃','⚄','⚅'];
let balance = 0;
let side = 'low';
let busy = false;
let stats = { games:0, wins:0, losses:0 };
const user = getCurrentUser();

function updBal(){ $('#bal').textContent = fmtMoney(balance); }
function updStats(){
  $('#games').textContent = stats.games;
  $('#wins').textContent = stats.wins;
  $('#losses').textContent = stats.losses;
}

document.querySelectorAll('.choice').forEach(c=>{
  c.addEventListener('click',()=>{
    document.querySelectorAll('.choice').forEach(x=>x.classList.remove('active'));
    c.classList.add('active'); side = c.dataset.side;
  });
});
document.querySelectorAll('.preset').forEach(b=>{
  b.addEventListener('click',()=>{
    const v = b.dataset.v;
    if (v === 'all') $('#betInput').value = Math.max(10, Math.floor(balance));
    else $('#betInput').value = v;
  });
});

function multFor(s){ return s==='seven' ? 5.0 : 2.4; }

async function roll(){
  if (busy) return;
  if (!user) { showToast('Tizimga kiring!', 'lose'); return; }
  const bet = Math.floor(parseFloat($('#betInput').value) || 0);
  if (bet < 10) { showToast("Minimum 10 so'm",'lose'); return; }
  if (bet > balance) { showToast('Balans yetarli emas!', 'lose'); return; }

  busy = true; $('#rollBtn').disabled = true;
  $('#result').textContent = 'Otilmoqda...'; $('#result').className = 'result-text';
  $('#sumDisp').textContent = '— + — = —';

  try { await changeBalance(user.name, -bet, { isBet: true }); }
  catch(e){ busy=false; $('#rollBtn').disabled=false; showToast('Xato!','lose'); return; }

  const d1El = $('#d1'), d2El = $('#d2');
  d1El.classList.remove('rolling'); d2El.classList.remove('rolling');
  void d1El.offsetWidth; void d2El.offsetWidth;
  d1El.classList.add('rolling'); d2El.classList.add('rolling');

  // Aylanish jarayonida tasodifiy ko'rsatish
  const animInt = setInterval(()=>{
    d1El.textContent = DICE_FACES[Math.floor(Math.random()*6)];
    d2El.textContent = DICE_FACES[Math.floor(Math.random()*6)];
  }, 100);

  setTimeout(async () => {
    clearInterval(animInt);
    const r1 = 1 + Math.floor(Math.random()*6);
    const r2 = 1 + Math.floor(Math.random()*6);
    const sum = r1 + r2;
    d1El.textContent = DICE_FACES[r1-1];
    d2El.textContent = DICE_FACES[r2-1];
    $('#sumDisp').textContent = `${r1} + ${r2} = ${sum}`;

    let win = false;
    if (side === 'low' && sum >= 2 && sum <= 6) win = true;
    else if (side === 'high' && sum >= 8 && sum <= 12) win = true;
    else if (side === 'seven' && sum === 7) win = true;

    stats.games++;
    if (win) {
      const mult = multFor(side);
      const winAmount = Math.floor(bet * mult);
      await changeBalance(user.name, +winAmount, { isWin: true, gameEnd: true });
      await logGame(user.name, 'dice', bet, winAmount, mult);
      stats.wins++;
      $('#result').textContent = `🎉 Yutdingiz! +${fmtMoney(winAmount - bet)} so'm (×${mult})`;
      $('#result').className = 'result-text win';
      showToast(`+${fmtMoney(winAmount - bet)} so'm`, 'win');
    } else {
      await changeBalance(user.name, 0, { gameEnd: true });
      await logGame(user.name, 'dice', bet, 0, 0);
      stats.losses++;
      $('#result').textContent = `😔 Mag'lub! −${fmtMoney(bet)} so'm`;
      $('#result').className = 'result-text lose';
      showToast(`−${fmtMoney(bet)} so'm`, 'lose');
    }
    updStats();
    busy = false; $('#rollBtn').disabled = false;
  }, 1500);
}

$('#rollBtn').addEventListener('click', roll);

if (!user) {
  showToast('Tizimga kiring!', 'lose');
  $('#bal').textContent = '0';
} else {
  (async () => {
    try {
      const res = await initUser(user.name);
      balance = Number(res.data.balance) || 0;
      updBal();
      if (res.bonusGiven) showToast(`🎁 Bonus: +${fmtMoney(res.bonusAmount)} so'm`, 'win');
      watchUser(user.name, (data) => {
        if (!data) return;
        balance = Number(data.balance) || 0; updBal();
      });
    } catch(e) { console.error(e); showToast('Firebase xato!','lose'); }
  })();
}
</script>
</body>
</html>
